# Netlify serves the static dashboard (app/static) and proxies every dynamic
# route to the FastAPI backend, which must be hosted somewhere that can run a
# long-lived Python process (Render, Railway, Fly.io, a VPS, ...).
# Netlify Functions cannot run the crawler / SQLite / Playwright.
#
# >>> Replace https://YOUR-BACKEND.example.com with your backend URL (3 places
# >>> below use the same host). Redirect rules can't read env vars.

[build]
  publish = "app/static"
  # no build step: plain HTML + vendored lucide.min.js

# --- API + first-party traffic tracker -> backend (proxied, URL stays on Netlify)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.example.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/t/*"
  to = "https://YOUR-BACKEND.example.com/t/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/t.js"
  to = "https://YOUR-BACKEND.example.com/t.js"
  status = 200
  force = true

# --- the page references assets as /static/..., but they live at the publish root
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# --- SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/lucide.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
